name: Build CHK Binance APK
on:
  workflow_dispatch:
  push:
    branches: [binance-portfolio-app]
    paths:
      - 'binance-portfolio-android/**'
      - '.github/workflows/build-binance-portfolio.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: binance-portfolio-android
      - uses: actions/upload-artifact@v4
        with:
          name: CHK-Binance-Portfolio-APK
          path: binance-portfolio-android/app/build/outputs/apk/debug/app-debug.apk
