name: Build SYNC Store APK

on:
  push:
    branches:
      - agent/sync-store-apk-build
    paths:
      - '.github/workflows/build-sync-store-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE/sync-store-wrapper"
          mkdir -p "$ROOT/app/src/main/java/com/sync/store"
          mkdir -p "$ROOT/app/src/main/res/drawable"
          mkdir -p "$ROOT/app/src/main/res/values"

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'SYNCStore'
          include ':app'
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.sync.store'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.sync.store'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.SyncStore"
                  android:label="SYNC Store"
                  android:icon="@drawable/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="Theme.SyncStore" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#7C3CFF</item>
                  <item name="android:navigationBarColor">#07080F</item>
                  <item name="android:statusBarColor">#07080F</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#080913" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#7C3CFF" android:pathData="M18,12h72a6,6 0,0 1,6 6v72a6,6 0,0 1,-6 6h-72a6,6 0,0 1,-6 -6v-72a6,6 0,0 1,6 -6z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M72,31c-5,-5 -11,-7 -18,-7 -11,0 -20,6 -24,15l11,5c2,-5 7,-8 13,-8 4,0 7,1 10,4l-7,7h21v-21l-6,5zM36,77c5,5 11,7 18,7 11,0 20,-6 24,-15l-11,-5c-2,5 -7,8 -13,8 -4,0 -7,-1 -10,-4l7,-7h-21v21l6,-5z"/>
          </vector>
          EOF

          cat > "$ROOT/app/src/main/java/com/sync/store/MainActivity.java" <<'EOF'
          package com.sync.store;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String SITE_URL = "https://sync-store-chk-chasmets-projects.vercel.app";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(android.graphics.Color.rgb(7, 8, 15));
                  getWindow().setNavigationBarColor(android.graphics.Color.rgb(7, 8, 15));

                  webView = new WebView(this);
                  webView.setBackgroundColor(android.graphics.Color.rgb(7, 8, 15));
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  setContentView(webView);

                  if (savedInstanceState == null) webView.loadUrl(SITE_URL);
                  else webView.restoreState(savedInstanceState);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          gradle -p "$GITHUB_WORKSPACE/sync-store-wrapper" :app:assembleDebug --stacktrace
          cp "$GITHUB_WORKSPACE/sync-store-wrapper/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/SYNC-Store.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SYNC-Store-APK
          path: SYNC-Store.apk
          if-no-files-found: error
