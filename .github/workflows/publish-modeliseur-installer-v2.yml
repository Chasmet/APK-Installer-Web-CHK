name: Publier APK Installer CHK v2 Modeliseur

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK réel
        run: gradle -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true clean assembleDebug

      - name: Vérifier APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 50000
          mkdir -p release
          cp "$APK" release/APK-Installer-CHK-v2-Modeliseur.apk
          sha256sum release/APK-Installer-CHK-v2-Modeliseur.apk | tee release/SHA256.txt

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Installer-CHK-v2-Modeliseur
          path: |
            release/APK-Installer-CHK-v2-Modeliseur.apk
            release/SHA256.txt
          retention-days: 30

      - name: Publier Release directe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete installer-modeliseur-v2 --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create installer-modeliseur-v2 \
            release/APK-Installer-CHK-v2-Modeliseur.apk \
            release/SHA256.txt \
            --title "APK Installer CHK v2 — Modeliseur 3D" \
            --notes "Petit installateur Android natif. Télécharge Modeliseur 3D V9.1 via DownloadManager, affiche la progression, vérifie exactement 936057609 octets et le SHA-256 9f9d2b3c40b000ddadd5d632259ab0e3ffee2390cf48ff8072961b5329b5fe81 avant d'ouvrir l'installation Android." \
            --prerelease
