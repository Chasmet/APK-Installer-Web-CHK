name: Publier APK Installer CHK v3 Modeliseur V9.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK réel
        run: gradle -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true clean assembleDebug

      - name: Vérifier APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 50000
          mkdir -p release
          cp "$APK" release/APK-Installer-CHK-v3-Modeliseur-V9.2.apk
          sha256sum release/APK-Installer-CHK-v3-Modeliseur-V9.2.apk | tee release/SHA256.txt
          stat -c%s release/APK-Installer-CHK-v3-Modeliseur-V9.2.apk | tee release/SIZE.txt

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Installer-CHK-v3-Modeliseur-V9.2
          path: |
            release/APK-Installer-CHK-v3-Modeliseur-V9.2.apk
            release/SHA256.txt
            release/SIZE.txt
          retention-days: 30

      - name: Publier Release directe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete installer-modeliseur-v3 --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create installer-modeliseur-v3 \
            release/APK-Installer-CHK-v3-Modeliseur-V9.2.apk \
            release/SHA256.txt \
            release/SIZE.txt \
            --title "APK Installer CHK v3 — Modeliseur V9.2 Thin" \
            --notes "Installateur Android léger dédié à Modeliseur V9.2 Thin. Il télécharge l'APK vérifiée de 11995051 octets via DownloadManager et contrôle le SHA-256 af0f7ed5a01ab822958426ec16422121e2e674350677af9c0f3135e409fae10c avant installation. Les gros moteurs IA sont ensuite téléchargés séparément par Modeliseur avec reprise automatique." \
            --prerelease
