name: Publier APK Installer CHK v3.3 Modeliseur V9.5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK réel
        run: gradle -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true clean assembleDebug

      - name: Vérifier APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 50000
          mkdir -p release
          cp "$APK" release/APK-Installer-CHK-v3.3-Modeliseur-V9.5.apk
          sha256sum release/APK-Installer-CHK-v3.3-Modeliseur-V9.5.apk | tee release/SHA256.txt
          stat -c%s release/APK-Installer-CHK-v3.3-Modeliseur-V9.5.apk | tee release/SIZE.txt

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Installer-CHK-v3.3-Modeliseur-V9.5
          path: |
            release/APK-Installer-CHK-v3.3-Modeliseur-V9.5.apk
            release/SHA256.txt
            release/SIZE.txt
          retention-days: 30

      - name: Publier Release directe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete installer-modeliseur-v3 --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create installer-modeliseur-v3 \
            release/APK-Installer-CHK-v3.3-Modeliseur-V9.5.apk \
            release/SHA256.txt \
            release/SIZE.txt \
            --title "APK Installer CHK v3.3 — Modeliseur V9.5 Thin" \
            --notes "Installateur Android dédié à Modeliseur V9.5 Thin Zero-Copy. Il télécharge directement en HTTPS l'APK de 12007339 octets avec reprise, progression réelle et contrôle SHA-256 05e04b9703375302d66ad3733a29a0a9e61a65609dd573498176760af5c4fa89 avant installation. Les modèles IA restent séparés, vérifiés et réutilisables hors ligne." \
            --prerelease
